# Builds the site and publishes it to the gh-pages branch (GitHub Pages serves that branch).
# Same result as running `npm run deploy` locally — but automatic on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

permissions:
  contents: write # push to the gh-pages branch

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Default base path is /portfolio/ (see base.config.js) — correct for GitHub Pages
      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "deploy: ${{ github.sha }}"
